<title>Book Distribution App</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column; a screen title, the screen body, and a bottom area holding an optional action bar plus four tabs. */
:root {
  --bg: #f6f5f2;
  --surface: #ffffff;
  --fg: #1d1a16;
  --muted: #6f6a62;
  --line: #e6e3dd;
  --accent: #d9620b;
  --accent-fg: #ffffff;
  --accent-soft: #fdeede;
  --ok: #1f7a4d;
  --due: #b3261e;
  --cover-1: #b3261e; --cover-2: #1f5fa8; --cover-3: #2e7d5b;
  --cover-4: #7a4bb0; --cover-5: #c08a12; --cover-6: #0f7f8c;
  --display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --text: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151310; --surface: #211e1a; --fg: #f3efe8; --muted: #a59e93; --line: #36312a;
    --accent: #f08a3a; --accent-fg: #1d1206; --accent-soft: #3a2614; --ok: #5cc490; --due: #f0857c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151310; --surface: #211e1a; --fg: #f3efe8; --muted: #a59e93; --line: #36312a;
  --accent: #f08a3a; --accent-fg: #1d1206; --accent-soft: #3a2614; --ok: #5cc490; --due: #f0857c;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { overflow-y: scroll; } /* always reserve the scrollbar so short and long screens are the same width */
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--text); font-size: 16px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); font-size: 14px; }

.app {
  max-width: 430px; min-height: 100%; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px;
  padding-block: 10px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#view { display: flex; flex-direction: column; gap: 10px; }

.top { display: flex; align-items: center; gap: 8px; }
.top h1 { flex: 1; min-width: 0; margin: 0; font-family: var(--display); font-size: 22px; font-weight: 700; text-wrap: balance; }
.round {
  flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 14px;
}
.round svg, .field svg, .tabs svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* fields */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field {
  display: flex; align-items: center; gap: 8px; min-width: 0; height: 42px; padding: 0 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
}
.field svg { flex: none; color: var(--muted); }
.field input, .field select { min-width: 0; width: 100%; border: 0; background: transparent; padding: 0; }
.field input:focus, .field select:focus { outline: none; }
.field:focus-within { border-color: var(--accent); }
.field .ptxt { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.field.big { height: 64px; }
.field.big input { font-family: var(--display); font-size: 28px; font-weight: 600; }
.field.big span { font-family: var(--display); font-size: 28px; color: var(--muted); }
.form { display: flex; flex-direction: column; gap: 10px; }

/* segmented control and chips */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--line); border-radius: 12px; }
.seg button { height: 40px; border: 0; border-radius: 9px; background: transparent; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); font-weight: 600; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -2px; padding: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 34px; padding: 0 14px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-weight: 500;
  display: flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip b { font-weight: 600; font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }

/* rows */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 6px 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
}
.row.on { border-color: var(--accent); }
.row .info { flex: 1; min-width: 0; }
.row .name { font-weight: 600; line-height: 1.25; }
.row .sub { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .end { flex: none; text-align: right; }
.row.top-align { align-items: flex-start; }
.items { margin: 4px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; line-height: 1.5; }
.row .end strong { display: block; font-family: var(--display); font-size: 18px; font-weight: 600; }
.pos { color: var(--ok); } .neg { color: var(--due); }
.cover { flex: none; width: 30px; height: 42px; object-fit: cover; border-radius: 2px; }
.avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.step { flex: none; display: flex; align-items: center; }
.step button { width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 24px; line-height: 1; }
.step .plus { background: var(--accent); color: var(--accent-fg); }
.step output { width: 36px; text-align: center; font-family: var(--display); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* stock summary */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 4px 16px; }
.hero summary { display: flex; align-items: baseline; gap: 8px; padding: 12px 0; cursor: pointer; list-style: none; }
.hero summary::-webkit-details-marker { display: none; }
.hero summary:focus-visible { outline-offset: -2px; border-radius: 10px; }
.hero summary:focus:not(:focus-visible) { outline: none; }
.hero summary strong { font-family: var(--display); font-size: 40px; font-weight: 700; line-height: 1; }
.hero summary span { flex: 1; color: var(--muted); }
.hero summary i { font-style: normal; color: var(--accent); font-weight: 600; font-size: 14px; }
.hero dl { margin: 0; padding: 4px 0 12px; display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.hero dt { min-width: 0; } .hero dd { margin: 0; font-weight: 600; text-align: right; }
.loan { margin: 0; display: grid; grid-template-columns: 1fr auto auto; gap: 8px 0; align-items: baseline; }
.loan dt { min-width: 0; } .loan dd { margin: 0; padding-left: 14px; text-align: right; }
.loan .tot { border-top: 1px solid var(--line); padding-top: 8px; font-weight: 600; }
h2 { margin: 8px 0 -4px; font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }

.btn { height: 46px; padding: 0 24px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: 17px; }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.line { background: var(--surface); color: var(--fg); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn:disabled { background: var(--line); color: var(--muted); cursor: default; }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 12px; align-self: center; }

/* admin */
.map { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.map svg { display: block; width: 100%; height: auto; }
.map .road { stroke: var(--line); stroke-width: 5; fill: none; stroke-linecap: round; }
.map .road.thin { stroke-width: 2.500; }
.map .spot circle { fill: var(--accent); fill-opacity: .28; stroke: var(--accent); stroke-width: 1.500; }
.map .spot.sel circle { fill-opacity: .6; }
.map .spot circle.dot { fill: var(--muted); fill-opacity: 1; stroke: none; }
.map .pin { fill: var(--accent); } .map .hole { fill: var(--surface); }
#np-map { cursor: crosshair; touch-action: manipulation; }
.map text { fill: var(--fg); font-family: var(--text); font-size: 10px; text-anchor: middle; }
.map text.n { font-family: var(--display); font-weight: 600; font-size: 12px; }
.caption { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.caption strong { font-weight: 600; }
.lead { display: grid; grid-template-columns: 20px 1fr auto; gap: 4px 10px; align-items: center; }
.lead .rank { color: var(--muted); font-weight: 600; }
.lead .track { grid-column: 2 / 4; height: 8px; border-radius: 4px; background: var(--line); }
.lead .track div { height: 100%; border-radius: 4px; background: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.card h3 { margin: 0; font-family: var(--display); font-size: 20px; }

/* sign-in */
.center { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding-bottom: 48px; }
.center h1 { margin: 0 0 4px; font-family: var(--display); font-size: 34px; line-height: 1.1; text-wrap: balance; }
.g { width: 20px; height: 20px; border-radius: 50%; background: conic-gradient(#ea4335 0 25%, #4285f4 0 50%, #34a853 0 75%, #fbbc05 0); }

/* bottom */
.bottom { position: sticky; bottom: 0; margin-top: auto; margin-inline: -16px; background: var(--bg); border-top: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.bar .total { flex: 1; min-width: 0; }
.bar .total strong { display: block; font-family: var(--display); font-size: 22px; font-weight: 700; }
.bar .btn.wide { flex: 1; }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.tabs button { height: 52px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.toast {
  position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 500; z-index: 5;
}
@media (prefers-reduced-motion: no-preference) {
  .step button:active, .btn:active { transform: scale(.95); }
}
</style>

<div class="app">
  <div id="view"></div>
  <div class="bottom" id="bottom"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

function inHand(who = ME) { // anyone's stock; the signed-in member by default
  const h = {};
  const add = (items, s) => Object.entries(items).forEach(([k, v]) => h[k] = (h[k] || 0) + s * v);
  LEDGER.forEach(e => e.kind !== "pay" && (e.to === who ? add(e.items, 1) : e.from === who ? add(e.items, -1) : 0)); // paying moves no books
  HIST.forEach(e => e.who === who && add(e.items, -1));
  return h;
}

// Takes n books off the front of a title's lots (oldest first) and returns their value at the lent price.
function take(lots, n) {
  let v = 0;
  while (n > 0 && lots.length) { const t = Math.min(n, lots[0].n); v += t * lots[0].price; n -= t; if (!(lots[0].n -= t)) lots.shift(); }
  return v;
}
// Books on loan from lender to borrower: { key: [{ n, price }, ...] }, oldest first. Returns and payments take the oldest.
function loans(lender, borrower) {
  const L = {};
  [...LEDGER].reverse().forEach(e => {
    if (e.kind === "lend" && e.from === lender && e.to === borrower)
      Object.entries(e.items).forEach(([k, n]) => (L[k] ||= []).push({ n, price: e.price[k] }));
    else if ((e.kind === "return" || e.kind === "pay") && e.from === borrower && e.to === lender)
      Object.entries(e.items).forEach(([k, n]) => take(L[k] ||= [], n));
  });
  return L;
}
// { rows: { key: { n, amt } }, n, amt } for what is still on loan
function tally(L) {
  const rows = {}; let n = 0, amt = 0;
  for (const k in L) {
    const t = L[k].reduce((a, l) => ({ n: a.n + l.n, amt: a.amt + l.n * l.price }), { n: 0, amt: 0 });
    if (t.n) { rows[k] = t; n += t.n; amt += t.amt; }
  }
  return { rows, n, amt };
}

}

}
const keyOf = (p, id) => (book("|" + id).size === "kids" ? "English" : p.lang) + "|" + id;
// Matches part of the name ("krish") or the first letters of its words ("kb" = Krishna Book).
function matches(name, q) {
  const norm = t => t.toLowerCase().replace(/-/g, " ").replace(/\s+/g, " ").trim();
  q = norm(q); name = norm(name);
  const nw = name.split(" "), initials = nw.filter(w => w !== "of" && w !== "and").map(w => w[0]).join("");
  // matches part of the name, each typed word starting a name word in order, or the initials ("ssr")
  return !q || name.includes(q) || q.split(" ").every((w, i) => nw[i] && nw[i].startsWith(w)) || initials.startsWith(q.replace(/ /g, ""));
}
function pickRows(p) {
  // a size tag filters; with no tag, kids books show only under English
  // p.cap (Lend only): just the books in hand, each up to the number held
  const found = BOOKS.filter(b => (p.size ? b.size === p.size : b.size !== "kids" || p.lang === "English") && matches(b.name, p.q || "") && (!p.cap || p.cap[keyOf(p, b.id)]));
  if (!found.length) return `<li class="muted" style="padding:12px;text-align:center">${p.cap ? "No books in hand" : "No book found"}</li>`;
  return found.map(b => {
    const n = p.qty[keyOf(p, b.id)] || 0, max = p.cap ? p.cap[keyOf(p, b.id)] : Infinity;
    return `<li class="row${n ? " on" : ""}">
      ${b.cover ? `<img class="cover" src="${b.cover}" alt="">` : `<span class="cover" style="background:var(--line)"></span>`}
      <div class="info"><div class="name">${b.name}</div><div class="sub num">${rupees(b.price)}${p.cap ? ` · ${max} in hand` : ""}</div></div>
      <div class="step">
        ${n ? `<button type="button" data-id="${b.id}" data-d="-1" aria-label="One less ${b.name}">−</button><output>${n}</output>` : ""}
        ${n < max ? `<button class="plus" type="button" data-id="${b.id}" data-d="1" aria-label="One more ${b.name}">+</button>` : ""}
      </div></li>`;
  }).join("");
}
const totalBar = (qty, label) => {
  const t = sum(qty);
  return `<div class="bar"><div class="total num"><strong>${books(t.n)}</strong><span class="muted">${rupees(t.amt)}</span></div>
    <button class="btn" type="button" data-act="save">${label || "Save"}</button></div>`;
};
const dateField = (id, v) => `<label class="field" aria-label="Date">${ICON.cal}<input id="${id}" type="date" value="${v}" max="${TODAY}" data-bind="date"></label>`;

// One distribution per row, every book with its language. who: also show the volunteer's name; otherwise each row has Edit.
const entryList = (rows, who) => rows.length ? `<ul class="list">${rows.map(e => {
  const t = sum(e.items);
  const what = Object.entries(e.items).map(([k, v]) => `<li>${v} × ${book(k).name} · ${k.split("|")[0]}</li>`).join("");
  return `<li class="row top-align"><div class="info"><div class="name">${who ? NAME(e.who) + " · " : ""}${day(e.date)} · ${e.place}</div><ul class="items num">${what}</ul></div>
    <div class="end num"><strong>${t.n}</strong><span class="muted">${rupees(t.amt)}</span></div>
    ${who ? "" : `<button class="round" type="button" data-act="edit" data-arg="${HIST.indexOf(e)}" aria-label="Edit entry">${ICON.edit}</button>`}</li>`;
}).join("")}</ul>` : EMPTY("No entries yet");

const distForm = o => `<div class="two">${dateField("add-date", o.date)}
    <button class="field" type="button" data-act="places" aria-label="Place">${ICON.pin}<span class="ptxt">${o.place || "Choose place"}</span></button>
  </div>${picker(o)}`;

// Saved places nearest first; typing filters them.
function placeRows() {
  const q = clean(S.pq || "");
  const rows = PLACES.map((p, i) => [p, i]).filter(([p]) => matches(p.name, q)).sort((a, b) => dist(a[0]) - dist(b[0])).map(([p, i]) =>
    `<li><button class="row${p.name === pick.place ? " on" : ""}" type="button" data-act="place" data-arg="${i}">
      <div class="info"><div class="name">${p.name}</div></div><div class="end muted num">${far(p)}</div></button></li>`);
  return rows.join("") || `<li class="muted" style="padding:12px;text-align:center">No place found</li>`;
}

// ---------- render ----------
const $ = id => document.getElementById(id);
function render() {
  const v = VIEWS[S.screen]();
  const head = v.bare ? "" : `<header class="top">
      ${v.back ? `<button class="round" type="button" data-act="go" data-arg="${v.back}" aria-label="Back">${ICON.back}</button>` : ""}
      <h1>${v.title}</h1>
      ${v.test ? `<button type="button" data-act="mode" aria-pressed="${STEPS}" aria-label="Test: step-by-step picker" title="Test toggle"
        style="width:14px;height:14px;padding:0;border-radius:50%;border:1px solid var(--muted);background:${STEPS ? "var(--muted)" : "transparent"}"></button>` : ""}
      ${v.me ? `<button class="round" type="button" data-act="go" data-arg="signin" aria-label="Switch member">${initials(NAME(ME))}</button>` : ""}</header>`;
  $("view").innerHTML = head + v.body;
  $("view").style.flex = v.bare ? "1" : "";
  $("bottom").hidden = !!v.bare;
  $("bottom").innerHTML = (v.bar || "") + `<nav class="tabs" aria-label="Sections">${
    [["add", "Distribute"], ["history", "Entries"], ["stock", "Stock"], ["stats", "Stats"], ["admin", "Admin"]].filter(([k]) => (k !== "stock" || USERS[ME][2]) && (k !== "admin" || USERS[ME][3])).map(([k, l]) =>
      `<button type="button" data-act="tab" data-arg="${k}"${S.tab === k ? ' aria-current="page"' : ""}>${ICON[k === "history" ? "hist" : k]}${l}</button>`).join("")}</nav>`;
}
function go(screen) { S.screen = screen; render(); window.scrollTo(0, 0); }
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 1600);
}

function save() {
  if (S.screen === "add") {
    if (!sum(S.add.qty).n) return toast("Add at least one book");
    if (!S.add.place) return toast("Choose a place");
    HIST.unshift({ who: ME, date: S.add.date, place: S.add.place, items: S.add.qty });
    S.add = { qty: {}, lang: S.add.lang, size: STEPS ? null : S.add.size, date: TODAY, place: S.add.place };
    render(); // stay on the page, cleared for the next entry
  } else if (S.screen === "edit") {
    const { e, date, place, qty } = S.ed;
    if (!sum(qty).n) return toast("Add at least one book");
    Object.assign(e, { date, place, items: qty });
    go("history");
  } else if (S.screen === "newplace") {
    const name = clean(S.np.name);
    if (!name) return toast("Name this place");
    if (PLACES.some(p => p.name.toLowerCase() === name.toLowerCase())) return toast("That name is already used");
    PLACES.push({ name, x: S.np.x, y: S.np.y }); pick.place = name; go(S.plBack);
  } else if (S.screen === "entry") {
    const f = S.tf, gave = f.dir === "gave";
    const e = { kind: f.kind, from: gave ? ME : f.person, to: gave ? f.person : ME, date: f.date, items: f.qty, by: ME };
    if (!sum(f.qty).n) return toast("Add at least one book");
    const cap = f.kind === "lend" && capOf(f);
    if (cap && Object.entries(f.qty).some(([k, n]) => n > (cap[k] || 0))) return toast("More than is in hand");
    if (f.kind === "lend") e.price = Object.fromEntries(Object.keys(f.qty).map(k => [k, book(k).price])); // price on the day lent
    else {
      const L = tfLoans(), cap = settleCap(f);
      if (Object.entries(f.qty).some(([k, n]) => n > (cap[k] || 0))) return toast(f.kind === "return" ? "More than is on loan or in hand" : "More than is on loan");
      e.amount = cost(L, f.qty);
    }
    LEDGER.unshift(e); S.person = f.person; go("person");
  } else if (S.screen === "adjust") {
    const a = S.adj, add = a.dir === "add", cap = !add && capOf({ dir: "gave" });
    if (!sum(a.qty).n) return toast("Add at least one book");
    if (cap && Object.entries(a.qty).some(([k, n]) => n > (cap[k] || 0))) return toast("More than is in hand");
    LEDGER.unshift({ kind: "adjust", from: add ? null : ME, to: add ? ME : null, date: TODAY, items: a.qty, reason: a.reason, by: ME });
    go("stock");
  }
  toast("Saved");
}

const ACTS = {
  go, save,
  signin: () => { // switch member: every screen is then drawn from their side
    ME = $("si-user").value;
    S.add = { qty: {}, lang: "English", date: TODAY, place: near() };
    ACTS.tab("add");
  },
  places: () => { S.plBack = S.screen; S.pq = ""; go("places"); }, // pick is still the form that opened it
  place: i => { pick.place = PLACES[i].name; go(S.plBack); },
  newplace: () => { S.np = { name: clean(S.pq), ...HERE }; go("newplace"); }, // a failed search carries over as the name
  signup: () => { ACTS.tab("add"); toast("Sign-up is not active in this demo"); },
  tab: a => { S.tab = a; S.person = null; go(a); },
  person: a => { S.person = a; go("person"); },
  entry: () => { S.tf = { person: S.person || others()[0], kind: "lend", dir: "gave", qty: {}, lang: "English", date: TODAY }; go("entry"); },
  settle: a => { const [kind, dir] = a.split(" "); S.tf = { person: S.person, kind, dir, qty: {}, date: TODAY }; go("entry"); }, // return or pay; dir gave = I am the borrower
  all: () => { S.tf.qty = settleCap(S.tf); render(); },
  edit: i => { const e = HIST[i]; S.ed = { e, date: e.date, place: e.place, qty: { ...e.items }, lang: "English" }; go("edit"); },
  adjust: () => { S.adj = { dir: "add", qty: {}, lang: "English", reason: "" }; go("adjust"); },
  adjdir: a => { S.adj.dir = a; render(); },
  tfdir: a => { S.tf.dir = a; render(); },
  atab: a => { S.adminTab = a; render(); },
  period: a => { S.period = a; render(); },
  spot: a => { S.spot = a; render(); },
  mode: a => { STEPS = a ? a === "true" : !STEPS; /* testing only: the tiny dot by the title */ pick.size = null; pick.langPicked = false; render(); },
  restart: () => { if (pick.size !== "kids" && pick.langPicked) pick.langPicked = false; else pick.size = null; render(); }, // back one step
};
document.addEventListener("click", e => {
  const z = e.target.closest("[data-size]"), l = e.target.closest("[data-lang]"), b = e.target.closest("[data-id]"), k = e.target.closest("[data-k]"), a = e.target.closest("[data-act]"), m = e.target.closest("#np-map");
  if (m) { // move the pin without redrawing, so the typed name keeps focus
    const r = m.getBoundingClientRect();
    S.np.x = Math.round((e.clientX - r.left) / r.width * 320); S.np.y = Math.round((e.clientY - r.top) / r.height * 280);
    $("np-pin").setAttribute("transform", `translate(${S.np.x} ${S.np.y})`);
  } else if (z) { pick.size = STEPS || pick.size !== z.dataset.size ? z.dataset.size : null; pick.langPicked = false; render(); }
  else if (l) { pick.lang = l.dataset.lang; pick.langPicked = STEPS; render(); }
  else if (k) {
    const key = k.dataset.k, q = S.tf.qty, max = settleCap(S.tf)[key] || 0;
    q[key] = Math.min(max, Math.max(0, (q[key] || 0) + Number(k.dataset.d)));
    if (!q[key]) delete q[key];
    render();
  } else if (b) {
    const k = keyOf(pick, b.dataset.id);
    pick.qty[k] = Math.min(pick.cap ? pick.cap[k] || 0 : Infinity, Math.max(0, (pick.qty[k] || 0) + Number(b.dataset.d)));
    if (!pick.qty[k]) delete pick.qty[k];
    render();
  } else if (a) ACTS[a.dataset.act](a.dataset.arg);
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches("g[data-act]")) ACTS[e.target.dataset.act](e.target.dataset.arg);
});
document.addEventListener("input", e => { // keep typed values without redrawing the screen
  const bind = e.target.dataset.bind, o = S.screen === "newplace" ? S.np : S.screen === "entry" ? S.tf : S.screen === "adjust" ? S.adj : S.screen === "edit" ? S.ed : S.add;
  if (bind === "pq") { S.pq = e.target.value; $("pl-list").innerHTML = placeRows(); }
  else if (bind === "q") { pick.q = e.target.value; $("pick-list").innerHTML = pickRows(pick); } // redraw only the list so typing keeps focus
  else if (bind) { o[bind] = e.target.value; if (bind === "person") render(); } // a new lender means a new in-hand list
});
render();
</script>
