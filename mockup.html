<title>Book Distribution App</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column; a screen title, the screen body, and a bottom area holding an optional action bar plus four tabs. */
:root {
  --bg: #f6f5f2;
  --surface: #ffffff;
  --fg: #1d1a16;
  --muted: #6f6a62;
  --line: #e6e3dd;
  --accent: #d9620b;
  --accent-fg: #ffffff;
  --accent-soft: #fdeede;
  --ok: #1f7a4d;
  --due: #b3261e;
  --cover-1: #b3261e; --cover-2: #1f5fa8; --cover-3: #2e7d5b;
  --cover-4: #7a4bb0; --cover-5: #c08a12; --cover-6: #0f7f8c;
  --display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --text: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151310; --surface: #211e1a; --fg: #f3efe8; --muted: #a59e93; --line: #36312a;
    --accent: #f08a3a; --accent-fg: #1d1206; --accent-soft: #3a2614; --ok: #5cc490; --due: #f0857c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151310; --surface: #211e1a; --fg: #f3efe8; --muted: #a59e93; --line: #36312a;
  --accent: #f08a3a; --accent-fg: #1d1206; --accent-soft: #3a2614; --ok: #5cc490; --due: #f0857c;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { overflow-y: scroll; } /* always reserve the scrollbar so short and long screens are the same width */
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--text); font-size: 16px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); font-size: 14px; }

.app {
  max-width: 430px; min-height: 100%; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px;
  padding-block: 10px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#view { display: flex; flex-direction: column; gap: 10px; }

.top { display: flex; align-items: center; gap: 8px; }
.top h1 { flex: 1; min-width: 0; margin: 0; font-family: var(--display); font-size: 22px; font-weight: 700; text-wrap: balance; }
.round {
  flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 14px;
}
.round svg, .field svg, .tabs svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* fields */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field {
  display: flex; align-items: center; gap: 8px; min-width: 0; height: 42px; padding: 0 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
}
.field svg { flex: none; color: var(--muted); }
.field input, .field select { min-width: 0; width: 100%; border: 0; background: transparent; padding: 0; }
.field input:focus, .field select:focus { outline: none; }
.field:focus-within { border-color: var(--accent); }
.field .ptxt { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.field.big { height: 64px; }
.field.big input { font-family: var(--display); font-size: 28px; font-weight: 600; }
.field.big span { font-family: var(--display); font-size: 28px; color: var(--muted); }
.form { display: flex; flex-direction: column; gap: 10px; }

/* segmented control and chips */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--line); border-radius: 12px; }
.seg button { height: 40px; border: 0; border-radius: 9px; background: transparent; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); font-weight: 600; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -2px; padding: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 34px; padding: 0 14px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-weight: 500;
  display: flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip b { font-weight: 600; font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }

/* rows */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 6px 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
}
.row.on { border-color: var(--accent); }
.row .info { flex: 1; min-width: 0; }
.row .name { font-weight: 600; line-height: 1.25; }
.row .sub { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .end { flex: none; text-align: right; }
.row.top-align { align-items: flex-start; }
.lang { color: var(--muted); font-weight: 400; font-size: 0.8em; }
select.lang { margin-left: 2px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.items b { color: var(--fg); font-weight: 600; }
.items { margin: 4px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; line-height: 1.5; }
.row .end strong { display: block; font-family: var(--display); font-size: 18px; font-weight: 600; }
.cover { flex: none; width: 30px; height: 42px; object-fit: cover; border-radius: 2px; }
.avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.step { flex: none; display: flex; align-items: center; }
.step button { width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 24px; line-height: 1; }
.step .plus { background: var(--accent); color: var(--accent-fg); }
.step output { width: 36px; text-align: center; font-family: var(--display); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

h2 { margin: 8px 0 -4px; font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }

.btn { height: 46px; padding: 0 24px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: 17px; }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.line { background: var(--surface); color: var(--fg); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn:disabled { background: var(--line); color: var(--muted); cursor: default; }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 12px; align-self: center; }

/* admin */
.map { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.map svg { display: block; width: 100%; height: auto; }
.map .road { stroke: var(--line); stroke-width: 5; fill: none; stroke-linecap: round; }
.map .road.thin { stroke-width: 2.500; }
.map .spot circle { fill: var(--accent); fill-opacity: .28; stroke: var(--accent); stroke-width: 1.500; }
.map .spot.sel circle { fill-opacity: .6; }
.map .spot circle.dot { fill: var(--muted); fill-opacity: 1; stroke: none; }
.map .pin { fill: var(--accent); } .map .hole { fill: var(--surface); }
#np-map { cursor: crosshair; touch-action: manipulation; }
.map text { fill: var(--fg); font-family: var(--text); font-size: 10px; text-anchor: middle; }
.map text.n { font-family: var(--display); font-weight: 600; font-size: 12px; }
.caption { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.caption strong { font-weight: 600; }
.chips.wrap { flex-wrap: wrap; }
.modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgb(0 0 0 / .45); }
.modal .card { width: 100%; max-width: 340px; background: var(--surface); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.modal h3 { margin: 0; font-family: var(--display); font-size: 20px; text-align: center; }
button.addp { border: 0; }
.btn.del { padding: 0 16px; background: var(--surface); color: var(--due); border: 1px solid var(--line); }
.addp { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); font-size: 24px; line-height: 1; }
.step .unit { margin: 0 6px 0 -4px; }
.chip .x { border: 0; background: none; padding: 0 0 0 2px; color: var(--muted); font-size: 18px; line-height: 1; }
.step .hrs { width: 52px; height: 40px; padding: 0; text-align: center; border: 0; background: transparent; font-family: var(--display); font-size: 20px; font-weight: 600; }

/* sign-in */
.center { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding-bottom: 48px; }
.center h1 { margin: 0 0 4px; font-family: var(--display); font-size: 34px; line-height: 1.1; text-wrap: balance; }
.g { width: 20px; height: 20px; border-radius: 50%; background: conic-gradient(#ea4335 0 25%, #4285f4 0 50%, #34a853 0 75%, #fbbc05 0); }

/* bottom */
.bottom { position: sticky; bottom: 0; margin-top: auto; margin-inline: -16px; background: var(--bg); border-top: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.bar .total { flex: 1; min-width: 0; }
.bar .total strong { display: block; font-family: var(--display); font-size: 22px; font-weight: 700; }
.bar .btn.wide { flex: 1; }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.tabs button { height: 52px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.tabs button:disabled { opacity: .35; }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.toast {
  position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 500; z-index: 5;
}
@media (prefers-reduced-motion: no-preference) {
  .step button:active, .btn:active { transform: scale(.95); }
}
</style>

<div class="app">
  <div id="view"></div>
  <div class="bottom" id="bottom"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

const qtyWhere = (p, f) => Object.entries(p.qty).reduce((s, [k, v]) => s + (f(k) ? v : 0), 0);
const tagCount = (p, t) => qtyWhere(p, k => {
  const kind = book(k).kind;
  return t === "kids" || t === "rare" ? kind === t : kind !== "kids" && !(RARE_TAG && kind === "rare") && k.startsWith(t + "|");

// Kids books are English only. Under the RARE tag each rare book has its own language (English by default),
// one per entry: changing it moves the count already there.
const rareKey = (p, id) => Object.keys(p.qty).find(k => k.endsWith("|" + id));
function langOf(p, b) {
  if (b.kind === "kids") return "English";
  if (b.kind === "rare" && RARE_TAG) return (rareKey(p, b.id) || "").split("|")[0] || (p.rl || {})[b.id] || "English";
  return p.lang;
}
const keyOf = (p, id) => langOf(p, book("|" + id)) + "|" + id;
function setRareLang(p, id, lang) {
  const old = rareKey(p, id);

  (p.rl ||= {})[id] = lang;
}
// Matches part of the name ("krish") or the first letters of its words ("kb" = Krishna Book).
function matches(name, q) {
  const norm = t => t.toLowerCase().replace(/-/g, " ").replace(/\s+/g, " ").trim();
  q = norm(q); name = norm(name);
  const nw = name.split(" "), initials = nw.filter(w => w !== "of" && w !== "and").map(w => w[0]).join("");
  // matches part of the name, each typed word starting a name word in order, or the initials ("ssr")
  return !q || name.includes(q) || q.split(" ").every((w, i) => nw[i] && nw[i].startsWith(w)) || initials.startsWith(q.replace(/ /g, ""));
}
function bookRow(p, b) {
  const n = p.qty[keyOf(p, b.id)] || 0, lg = langOf(p, b);
  const lang = b.kind === "rare" && RARE_TAG
    ? `<select class="lang" data-rl="${b.id}" aria-label="Language of ${b.name}">${LANGS.map(l => `<option value="${l}"${l === lg ? " selected" : ""}>${L3(l)}</option>`).join("")}</select>`

}
// A language shows its common books, then rare ones folded under "More books" (search shows them too).
// With RARE as a tag, a language shows only its common books.
function pickRows(p) {
  const q = p.q || "", hit = b => matches(b.name, q) || matches(SHORT(b), q);
  const own = p.lang === "kids" || p.lang === "rare" ? p.lang : "common";
  const main = BOOKS.filter(b => b.kind === own && hit(b));
  const rare = own !== "common" || RARE_TAG ? [] : BOOKS.filter(b => b.kind === "rare" && hit(b));
  if (!main.length && !rare.length) return `<li class="muted" style="padding:12px;text-align:center">No book found</li>`;
  const n = qtyWhere(p, k => book(k).kind === "rare" && k.startsWith(p.lang + "|")), open = p.more || q;
  return main.map(b => bookRow(p, b)).join("") + (!rare.length ? "" : q ? "" :

    + (open ? rare.map(b => bookRow(p, b)).join("") : "");
}

  <div class="two"><button class="btn soft" type="button" data-act="delno">Cancel</button><button class="btn" type="button" data-act="delyes">Delete</button></div></div></div>` : "";
const editBtn = (act, arg, label) => `<button class="round" type="button" data-act="${act}" data-arg="${arg}" aria-label="${label}">${ICON.edit}</button>`;
const itemList = items => `<ul class="items num">${Object.entries(items).map(([k, v]) =>
  `<li>${v} × <b>${SHORT(book(k))}</b> <span class="lang">${L3(k.split("|")[0])}</span></li>`).join("")}</ul>`;
const totalEnd = items => { const t = sum(items); return `<div class="end num"><strong>${t.n}</strong><span class="muted">${rupees(t.amt)}</span></div>`; };
const hr = h => h === "" ? "" : Number(h).toFixed(1); // hours always with one decimal: 1.0
// The host is the one who started the event, marked wherever volunteers are listed.
const names = ev => ev.team.map(u => NAME(u) + (u === ev.by ? " (Host)" : "")).join(", ");
const person = (u, end, host) => `<li class="row"><div class="avatar">${initials(NAME(u))}</div><div class="info"><div class="name">${NAME(u)}</div>${u === host ? `<div class="sub">Host</div>` : ""}</div>${end}</li>`;

// Event details: date, place and volunteers. The one who starts it is always on it.
function evForm(o) {
  pick = o; // the place and volunteer pickers write here
  return `<div class="two">${dateField(o.date)}
      <button class="field" type="button" data-act="places" aria-label="Place">${ICON.pin}<span class="ptxt">${o.place || "Choose place"}</span></button></div>
    <h2>Volunteers</h2>${teamChips(o)}
    <button class="btn soft" type="button" data-act="people">+ Volunteers</button>`;
}
// The event's volunteers as chips, × removes (not the starter).
const teamChips = (o, extra = "") => `<div class="chips wrap">${o.team.map(u => `<span class="chip">${NAME(u)}${u === ME ? ` <span class="lang">Host</span>` :
  `<button class="x" type="button" data-act="team" data-arg="${u}" aria-label="Remove ${NAME(u)}">×</button>`}</span>`).join("")}${extra}</div>`;
// One event: details, hours once closed, and its entries newest first. Only the one who started it can edit.
function evBody(ev) {
  const mine = ev.by === ME;
  const hours = ev.open ? "" : `<div class="top"><h2 style="flex:1">Hours</h2>${mine ? editBtn("hours", "", "Edit hours") : ""}</div>
    <ul class="list">${ev.team.map(u => person(u, `<div class="end num"><strong>${hr(ev.hours[u] || 0)} h</strong></div>`, ev.by)).join("")}</ul>`;
  return `<div class="row"><div class="info"><div class="name">${day(ev.date)} · ${ev.place}</div><div class="sub">${names(ev)}</div></div>
      ${mine ? editBtn("evedit", "", "Edit event") : ""}</div>
    ${hours}<div class="top"><h2 style="flex:1">Entries</h2>${mine ? `<button class="addp" type="button" data-act="addentry" aria-label="Add entry">+</button>` : ""}</div>${ev.entries.length ? `<ul class="list">${ev.entries.map((x, i) => `<li class="row top-align">
      <div class="info"><div class="name num">${x.at}</div>${itemList(x.items)}</div>${totalEnd(x.items)}
      ${mine ? editBtn("edit", i, "Edit entry") : ""}</li>`).join("")}</ul>` : EMPTY("No entries yet")}`;
}

// Saved places nearest first; typing filters them.
function placeRows() {
  const q = clean(S.pq || "");
  const rows = PLACES.map((p, i) => [p, i]).filter(([p]) => matches(p.name, q)).sort((a, b) => dist(a[0]) - dist(b[0])).map(([p, i]) =>
    `<li><button class="row${p.name === pick.place ? " on" : ""}" type="button" data-act="place" data-arg="${i}">
      <div class="info"><div class="name">${p.name}</div></div><div class="end muted num">${far(p)}</div></button></li>`);
  return rows.join("") || `<li class="muted" style="padding:12px;text-align:center">No place found</li>`;
}
function peopleRows() {
  const q = clean(S.uq || "");
  // only those not yet added; tapping one moves it up to the chips
  return Object.keys(USERS).filter(u => !pick.team.includes(u) && matches(NAME(u), q)).map(u =>
    `<li><button class="row" type="button" data-act="team" data-arg="${u}" aria-label="Add ${NAME(u)}">
      <div class="avatar">${initials(NAME(u))}</div><div class="info"><div class="name">${NAME(u)}</div></div><span class="addp" aria-hidden="true">+</span></button></li>`
  ).join("") || `<li class="muted" style="padding:12px;text-align:center">No volunteer found</li>`;
}

// ---------- screens: each returns { title, back, body, bar } ----------
const VIEWS = {
  signin: () => ({ bare: true, body: `<div class="center">
      <h1>Book Distribution</h1>
      <div class="form">
        <label class="field" aria-label="Member">${ICON.user}<select id="si-user">
          ${Object.keys(USERS).map(u => `<option value="${u}"${u === ME ? " selected" : ""}>${NAME(u)}</option>`).join("")}</select></label>
        <button class="btn" type="button" data-act="signin">Sign in</button>
        <p class="muted" style="margin:12px 0 0;text-align:center">New here?</p>
        <button class="btn line" type="button" data-act="go" data-arg="profile">Sign up</button>
      </div></div>` }),

  profile: () => ({ bare: true, body: `<div class="center">
      <h1>Sign up</h1>
      <div class="form">
        <label class="field" aria-label="Name">${ICON.user}<input id="pf-name" placeholder="Name" autocomplete="name"></label>
        <label class="field" aria-label="Phone"><span class="muted">+91</span><input id="pf-phone" type="tel" inputmode="numeric" placeholder="Phone number"></label>
        <button class="btn" type="button" data-act="signup">Sign up</button>
        <button class="link" type="button" data-act="go" data-arg="signin">Back to sign in</button>
      </div></div>` }),

  // No open event: start one here. Then this tab records books into it.
  add: () => {
    const ev = cur();
    if (!ev) return { title: "Start event", me: true, body: evForm(S.evf ||= newEv()), bar: saveBar("Start event") };
    return { title: "Book distribution", me: true, test: true, bar: totalBar(S.add.qty),
      body: picker(S.add) };
  },
  event: () => {
    const ev = cur();
    if (!ev) return { title: "Current event", me: true, body: EMPTY("No event running"),
      bar: `<div class="bar"><button class="btn wide" type="button" data-act="tab" data-arg="add">Start event</button></div>` };
    return { title: "Current event", me: true, body: evBody(ev), bar: totalBar(evItems(ev), "Close event", "close") };
  },
  past: () => {
    const rows = EVENTS.filter(e => !e.open && e.team.includes(ME));
    return { title: "Past events", me: true, body: rows.length ? `<ul class="list">${rows.map(e =>
      `<li><button class="row" type="button" data-act="pv" data-arg="${EVENTS.indexOf(e)}">
        <div class="info"><div class="name">${day(e.date)} · ${e.place}</div><div class="sub">${names(e)}</div></div>${totalEnd(evItems(e))}</button></li>`).join("")}</ul>` : EMPTY("No past events") };
  },
  pastev: () => ({ title: "Event", back: "past", body: evBody(S.pv), bar: totalBar(evItems(S.pv), "") }),
  edit: () => ({ title: S.ed.i < 0 ? "Add entry" : "Edit entry", back: S.ed.back, bar: totalBar(S.ed.qty, "Save", "save", S.ed.i < 0 ? "" : delBtn("entry")),
    body: picker(S.ed) + (S.ed.i < 0 ? "" : delModal("Delete entry?")) }),
  evedit: () => {
    const { ev } = S.ef, n = ev.entries.length;
    return { title: "Edit event", back: S.ef.back, bar: saveBar("Save", delBtn("event")), body: evForm(S.ef) +
      delModal(`Delete ${day(ev.date)} · ${ev.place} and its ${n} ${n === 1 ? "entry" : "entries"}?`) };
  },
  hours: () => ({ title: S.hrs.ev.open ? "Close event" : "Hours", back: S.hrs.back,
    body: `<h2>Hours of service</h2><ul class="list">${S.hrs.ev.team.map(u => person(u, `<div class="step">
      <button type="button" data-act="hr" data-arg="${u},-1" aria-label="Half an hour less for ${NAME(u)}">−</button>
      <input class="hrs num" type="text" inputmode="decimal" data-bind="h" data-u="${u}" value="${hr(S.hrs.h[u])}" aria-label="Hours for ${NAME(u)}"><span class="muted unit">h</span>
      <button class="plus" type="button" data-act="hr" data-arg="${u},1" aria-label="Half an hour more for ${NAME(u)}">+</button></div>`, S.hrs.ev.by)).join("")}</ul>
      ${S.hrs.sure ? `<div class="modal"><div class="card" role="alertdialog" aria-label="Close event?"><h3>Close event?</h3>
        <div class="two"><button class="btn soft" type="button" data-act="unsure">Cancel</button><button class="btn" type="button" data-act="save">Close</button></div></div></div>` : ""}`,
    bar: saveBar(S.hrs.ev.open ? "Close event" : "Save") }), // closing asks once more in a popup
  people: () => ({ title: "Volunteers", body: `${teamChips(pick)}<label class="field" aria-label="Search volunteers">${ICON.search}<input type="search" placeholder="Search volunteers" data-bind="uq" value="${clean(S.uq)}"></label>
      <ul class="list" id="ppl-list">${peopleRows()}</ul>`,
    bar: `<div class="bar"><button class="btn wide" type="button" data-act="go" data-arg="${S.pplBack}">Done</button></div>` }),

  places: () => ({ title: "Place", back: S.plBack, body: `<label class="field" aria-label="Search places">${ICON.search}<input id="pl-q" type="search" placeholder="Search places" data-bind="pq" value="${clean(S.pq)}"></label>
      <ul class="list" id="pl-list">${placeRows()}</ul>`,
    bar: `<div class="bar"><button class="btn soft wide" type="button" data-act="newplace">New location</button></div>` }),

  // Pin starts at the current location; tapping the map moves it. Saved places are shown so a duplicate is noticed.
  newplace: () => ({ title: "New location", back: "places", body: `<div class="map"><svg id="np-map" viewBox="0 0 320 280" role="img" aria-label="Map. Tap to move the pin">
        ${ROADS}
        ${PLACES.map(p => `<g class="spot"><circle class="dot" cx="${p.x}" cy="${p.y}" r="3.5"/><text x="${p.x}" y="${p.y + 14}">${p.name}</text></g>`).join("")}
        <g id="np-pin" transform="translate(${S.np.x} ${S.np.y})"><path class="pin" d="M0 0C-8-10-10-15-10-19a10 10 0 0 1 20 0c0 4-2 9-10 19z"/><circle class="hole" cy="-19" r="3.5"/></g></svg>
        <div class="caption muted">Tap the map to move the pin</div></div>
      <label class="field" aria-label="Place name">${ICON.pin}<input id="np-name" placeholder="Name this place" data-bind="name" value="${clean(S.np.name)}"></label>`,
    bar: saveBar() }),

  admin: () => {
    const tabs = `<div class="seg">${[["map", "Map"], ["events", "Events"]].map(([v, l]) =>
      `<button type="button" data-act="atab" data-arg="${v}" aria-pressed="${v === S.adminTab}">${l}</button>`).join("")}</div>`;
    if (S.adminTab === "events") return { title: "Admin", me: true, body: tabs + (EVENTS.length ? `<ul class="list">${EVENTS.map(ev => `<li class="row top-align">
      <div class="info"><div class="name">${NAME(ev.by)} · ${day(ev.date)} · ${ev.place}${ev.open ? ' <span class="lang">open</span>' : ""}</div>
      <div class="sub">${names(ev)}</div>${itemList(evItems(ev))}</div>${totalEnd(evItems(ev))}</li>`).join("")}</ul>` : EMPTY("No events yet")) };
    const by = total(EVENTS.filter(e => e.date >= ago(PERIODS[S.period][1])), e => e.place);
    const max = Math.max(1, ...Object.values(by).map(o => o.n));
    const body = `<div class="seg" role="group" aria-label="Period">${Object.entries(PERIODS).map(([k, [l]]) =>
        `<button type="button" data-act="period" data-arg="${k}" aria-pressed="${k === S.period}">${l}</button>`).join("")}</div>
      <div class="map"><svg viewBox="0 0 320 280" role="img" aria-label="Books distributed by place">
        ${ROADS}
        ${PLACES.filter(s => by[s.name]).map(s => {
          const r = 8 + 22 * Math.sqrt(by[s.name].n / max);
          return `<g class="spot">
            <circle cx="${s.x}" cy="${s.y}" r="${r.toFixed(1)}"/><text class="n" x="${s.x}" y="${s.y + 4}">${by[s.name].n}</text>
            <text x="${s.x}" y="${(s.y + r + 12).toFixed(1)}">${s.name}</text></g>`;
        }).join("")}</svg></div>`;
    return { title: "Admin", me: true, body: tabs + body };
  },
};

// ---------- render ----------
const $ = id => document.getElementById(id);
function render() {
  const v = VIEWS[S.screen]();
  const head = v.bare ? "" : `<header class="top">
      ${v.back ? `<button class="round" type="button" data-act="go" data-arg="${v.back}" aria-label="Back">${ICON.back}</button>` : ""}
      <h1>${v.title}</h1>
      ${v.test ? `<button type="button" data-act="mode" aria-pressed="${RARE_TAG}" aria-label="Test: RARE as a tag" title="Test toggle"
        style="width:14px;height:14px;padding:0;border-radius:50%;border:1px solid var(--muted);background:${RARE_TAG ? "var(--muted)" : "transparent"}"></button>` : ""}
      ${v.me ? `<button class="round" type="button" data-act="go" data-arg="signin" aria-label="Switch member">${initials(NAME(ME))}</button>` : ""}</header>`;
  $("view").innerHTML = head + v.body;
  $("view").style.flex = v.bare ? "1" : "";
  $("bottom").hidden = !!v.bare;
  $("bottom").innerHTML = (v.bar || "") + `<nav class="tabs" aria-label="Sections">${
    [["add", "Distribute"], ["event", "Current event"], ["past", "Past events"], ["admin", "Admin"]].filter(([k]) => k !== "admin" || USERS[ME][1]).map(([k, l]) =>
      `<button type="button" data-act="tab" data-arg="${k}"${S.tab === k ? ' aria-current="page"' : ""}${k === "event" && !cur() ? " disabled" : ""}>${ICON[k]}${l}</button>`).join("")}</nav>`;
}
function go(screen) { S.screen = screen; S.del = null; render(); window.scrollTo(0, 0); }
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 1600);
}

function save() {
  const s = S.screen, ev = cur();
  if (s === "add" && !ev) {
    if (!S.evf.place) return toast("Choose a place");
    EVENTS.unshift({ by: ME, ...S.evf, start: Date.now(), open: true, entries: [], hours: {} });
    S.evf = null; render(); return toast("Event started");
  }
  if (s === "add") {
    if (!sum(S.add.qty).n) return toast("Add at least one book");
    ev.entries.unshift({ at: new Date().toTimeString().slice(0, 5), items: S.add.qty });
    S.add = { ...S.add, qty: {}, q: "" }; render(); // stay on the page, cleared for the next entry
  } else if (s === "edit") {
    if (!sum(S.ed.qty).n) return toast("Add at least one book");
    const { ev: e, i, qty } = S.ed;
    if (i < 0) e.entries.unshift({ at: new Date().toTimeString().slice(0, 5), items: qty });
    else e.entries[i].items = qty;
    go(S.ed.back);
  } else if (s === "evedit") {
    const { ev: e, date, place, team } = S.ef;
    Object.assign(e, { date, place, team }); go(S.ef.back);
  } else if (s === "hours") {
    const { ev: e, h } = S.hrs;
    e.hours = Object.fromEntries(e.team.map(u => [u, Math.max(0, Number(h[u]) || 0)]));
    if (e.open && !S.hrs.sure) { S.hrs.sure = true; return render(); }
    if (e.open) { e.open = false; ACTS.tab("past"); return toast("Event closed"); }
    go(S.hrs.back);
  } else if (s === "newplace") {
    const name = clean(S.np.name);
    if (!name) return toast("Name this place");
    if (PLACES.some(p => p.name.toLowerCase() === name.toLowerCase())) return toast("That name is already used");
    PLACES.push({ name, x: S.np.x, y: S.np.y }); pick.place = name; go(S.plBack);
  }
  toast("Saved");
}

const evAt = () => S.screen === "pastev" ? S.pv : cur(); // the event on screen
const ACTS = {
  go, save,
  signin: () => { ME = $("si-user").value; S.add = newPick(); S.evf = null; ACTS.tab("add"); }, // every screen is then drawn from their side
  places: () => { S.plBack = S.screen; S.pq = ""; go("places"); }, // pick is still the form that opened it
  place: i => { pick.place = PLACES[i].name; go(S.plBack); },
  newplace: () => { S.np = { name: clean(S.pq), ...HERE }; go("newplace"); }, // a failed search carries over as the name
  people: () => { S.pplBack = S.screen; S.uq = ""; go("people"); },
  team: u => { pick.team = pick.team.includes(u) ? pick.team.filter(x => x !== u) : [...pick.team, u]; S.uq = ""; render(); },
  signup: () => { ACTS.tab("add"); toast("Sign-up is not active in this demo"); },
  tab: a => { S.tab = a; go(a); },
  pv: i => { S.pv = EVENTS[i]; go("pastev"); },
  edit: i => { const ev = evAt(); S.ed = { ev, i, back: S.screen, qty: { ...ev.entries[i].items }, lang: "English" }; go("edit"); },
  // + on the current event goes to Distribute; on a past one it opens the book picker for that event.
  addentry: () => { const ev = evAt(); if (ev.open) return ACTS.tab("add"); S.ed = { ev, i: -1, back: S.screen, qty: {}, lang: "English" }; go("edit"); },
  del: k => { S.del = k; render(); },
  delno: () => { S.del = null; render(); },
  delyes: () => {
    if (S.del === "entry") { S.ed.ev.entries.splice(S.ed.i, 1); go(S.ed.back); }
    else { const e = S.ef.ev; EVENTS.splice(EVENTS.indexOf(e), 1); ACTS.tab(e.open ? "add" : "past"); }
    toast("Deleted");
  },
  evedit: () => { const ev = evAt(); S.ef = { ev, back: S.screen, date: ev.date, place: ev.place, team: [...ev.team] }; go("evedit"); },
  // Close: everyone's hours start at the time since the event started, rounded to half an hour.
  close: () => {
    if (sum(S.add.qty).n) return toast("Save the books on Distribute first");
    const ev = cur(), h = Math.max(0.5, Math.round((Date.now() - ev.start) / 18e5) / 2);
    S.hrs = { ev, back: "event", h: Object.fromEntries(ev.team.map(u => [u, h])) }; go("hours");
  },
  unsure: () => { S.hrs.sure = false; render(); },
  hr: a => { const [u, d] = a.split(","); S.hrs.sure = false; S.hrs.h[u] = Math.max(0, (Number(S.hrs.h[u]) || 0) + d * 0.5); render(); }, // ± half an hour
  hours: () => { const ev = S.pv; S.hrs = { ev, back: "pastev", h: Object.fromEntries(ev.team.map(u => [u, ev.hours[u] ?? ""])) }; go("hours"); },
  atab: a => { S.adminTab = a; render(); },
  period: a => { S.period = a; render(); },
  mode: a => { RARE_TAG = a ? a === "true" : !RARE_TAG; /* testing only: the tiny dot by the title */ render(); },
  more: () => { pick.more = !pick.more; render(); },
};
document.addEventListener("click", e => {
  const l = e.target.closest("[data-lang]"), b = e.target.closest("[data-id]"), a = e.target.closest("[data-act]"), m = e.target.closest("#np-map");
  if (m) { // move the pin without redrawing, so the typed name keeps focus
    const r = m.getBoundingClientRect();
    S.np.x = Math.round((e.clientX - r.left) / r.width * 320); S.np.y = Math.round((e.clientY - r.top) / r.height * 280);
    $("np-pin").setAttribute("transform", `translate(${S.np.x} ${S.np.y})`);
  } else if (l) { pick.lang = l.dataset.lang; render(); }
  else if (b) {
    const k = keyOf(pick, b.dataset.id);
    pick.qty[k] = Math.max(0, (pick.qty[k] || 0) + Number(b.dataset.d));
    if (!pick.qty[k]) delete pick.qty[k];
    render();
  } else if (a) ACTS[a.dataset.act](a.dataset.arg);
});
document.addEventListener("change", e => { // a rare book's language, RARE as a tag
  const id = e.target.dataset.rl;
  if (id) { setRareLang(pick, id, e.target.value); render(); }
});
document.addEventListener("input", e => { // keep typed values without redrawing the screen
  const bind = e.target.dataset.bind, v = e.target.value;
  if (bind === "pq") { S.pq = v; $("pl-list").innerHTML = placeRows(); }
  else if (bind === "uq") { S.uq = v; $("ppl-list").innerHTML = peopleRows(); }
  else if (bind === "q") { pick.q = v; $("pick-list").innerHTML = pickRows(pick); } // redraw only the list so typing keeps focus
  else if (bind === "h") S.hrs.h[e.target.dataset.u] = v;
  else if (bind === "name") S.np.name = v;
  else if (bind === "date") pick.date = v;
});
render();
</script>
